# CI runs the host-side native/frontend suites and builds the production WebView2 target.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native unit tests (host-side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodules: the suites compile the runtime/api/input sources against tests/native/stubs (a std umbrella + a REX log stub), not CommonLibSF.
      - uses: actions/checkout@v4

      - name: Run native suites
        # Compiles the real store/module/bridge/api/hotkey sources on clang and runs them; 
        # exit code = number of failing checks (see tests/native/run.sh).
        run: bash tests/native/run.sh
        env:
          CXX: clang++

      - name: Check protocol version lockstep
        # Keep the public type contract and machine-readable schemas aligned with
        # kBridgeProtocolVersion in src/Core/Version.h.
        run: |
          set -e
          V=$(sed -n 's/.*kBridgeProtocolVersion = "\([0-9.]*\)".*/\1/p' src/Core/Version.h)
          test -n "$V" || { echo "::error::could not extract kBridgeProtocolVersion"; exit 1; }
          echo "kBridgeProtocolVersion = $V"
          fail=0
          check() { grep -qE "$2" "$1" || { echo "::error file=$1::contract does not claim bridge protocol $V ($2)"; fail=1; }; }
          check sdk/osfui.d.ts           "Bridge protocol version: $V"
          check docs/schema/manifest.schema.json        "Bridge protocol $V\."
          check docs/schema/settings-schema.schema.json "Bridge protocol $V\."
          exit $fail

      - name: Check every JSON read and write goes through the wrapper
        # src/Core/Json.h is the only place nlohmann is touched directly, and
        # each rule below was a real defect before it was a rule:
        #   dump()   - defaults to error_handler_t::strict, which THROWS on
        #              malformed UTF-8; most dump sites sit on the game tick or a
        #              pipe writer with no handler above them, so that is a
        #              std::terminate. Json::Dump substitutes U+FFFD.
        #   parse()  - the raw call skips ignore_comments, so a settings schema
        #              with // comments loaded from disk but was rejected over
        #              the C ABI. Json::Parse passes it everywhere.
        #   .value() - throws type_error.302 on a wrong-typed key and .306 on a
        #              non-object receiver, on those same threads. Json::Get
        #              falls back to the caller's default and cannot throw.
        # sdk/ is exempt: the public plugin header is standalone by design and
        # cannot include src/. Comments are stripped before matching so the
        # explanations above can name the very calls they forbid.
        run: |
          set -e
          fail=0
          check() {
            hits=$(grep -rn "$1" src tools --include='*.cpp' --include='*.h' --include='*.inl' \
                     | grep -v '^src/runtime/Json\.h:' \
                     | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS=: read -r file line _; do
                echo "::error file=$file,line=$line::$2"
              done
              fail=1
            fi
          }
          check '\.dump()'      'use Json::Dump() — a bare dump() throws on malformed UTF-8'
          check 'json::parse('  'use Json::Parse() — a raw parse() drops ignore_comments'
          check '\.value("'     'use Json::Get() — .value() throws on a wrong-typed key'
          [ "$fail" = 0 ] || exit 1
          echo "all JSON access goes through src/Core/Json.h"

      - name: Check plugin version lockstep
        run: |
          set -e
          V=$(sed -n 's/.*kOsfuiReleaseVersion = "\([0-9.]*\)".*/\1/p' src/Core/Version.h)
          test -n "$V" || { echo "::error::could not extract kOsfuiReleaseVersion"; exit 1; }
          grep -qF "set_version(\"$V\")" xmake.lua || {
            echo "::error file=xmake.lua::project version does not match kOsfuiReleaseVersion $V"
            exit 1
          }
          IFS=. read -r MAJOR MINOR PATCH <<< "$V"
          for pair in Major:$MAJOR Minor:$MINOR Patch:$PATCH; do
            name=${pair%%:*}
            value=${pair#*:}
            grep -qE "kOsfuiReleaseVersion${name} = ${value};" src/Core/Version.h || {
              echo "::error file=src/Core/Version.h::numeric $name does not match kOsfuiReleaseVersion $V"
              exit 1
            }
          done

  frontend:
    name: Frontend (typecheck, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep local and CI frontend builds on the same Node major.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build WebView2 (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, releasedbg]

    steps:
      - uses: actions/checkout@v4
        with:
          # lib/commonlibsf, which nests lib/commonlib-shared
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-pkg-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: xmake-pkg-${{ runner.os }}-

      - name: Validate shipped JSON
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.json -Path data, docs/schema | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            } catch {
              Write-Host "::error file=$($_.FullName)::invalid JSON: $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "all shipped JSON parses"

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = "1.0.4078.44"
          $archive = Join-Path $env:RUNNER_TEMP "webview2.zip"
          $uri = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath external/webview2 -Force

      - name: Configure
        run: xmake f -y -m ${{ matrix.mode }}

      - name: Build
        run: xmake build -y

      - name: Run WebView2 pipe transport tests
        run: |
          xmake build -y wv2-pipe-tests
          xmake run -y wv2-pipe-tests

      - name: Stage install layout
        run: xmake install -y -o out/staging "OSF UI"

      - name: Verify staged layout
        shell: pwsh
        run: |
          $root = "out/staging"
          $must = @(
            "$root/SFSE/Plugins/OSFUI.dll",
            "$root/SFSE/Plugins/OSFUI.pdb",
            "$root/SFSE/Plugins/OSFUI/bin/osfui_webview2_host.exe",
            "$root/SFSE/Plugins/OSFUI/settings/osfui.json",
            "$root/SFSE/Plugins/OSFUI/views/osfui/settings/manifest.json"
          )
          $failed = $false
          foreach ($f in $must) {
            if (-not (Test-Path $f)) {
              Write-Host "::error::missing from install layout: $f"
              $failed = $true
            }
          }
          # The runtime needs at least one view to host.
          $manifests = Get-ChildItem -Path "$root/SFSE/Plugins/OSFUI/views" -Recurse -Filter manifest.json -ErrorAction SilentlyContinue
          if (-not $manifests) {
            Write-Host "::error::no views/*/manifest.json in the install layout"
            $failed = $true
          }
          if ($failed) { exit 1 }
          Write-Host "install layout OK ($(($manifests | Measure-Object).Count) view manifest(s))"

      - uses: actions/upload-artifact@v4
        with:
          name: OSFUI-webview2-${{ matrix.mode }}
          path: out/staging/
          if-no-files-found: error
