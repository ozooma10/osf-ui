<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px Arial;color:#e8f3ff;background:transparent}
#panel{position:absolute;inset:0;background:#101b29;padding:48px}h1{font-size:32px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{height:68px;border:1px solid #38506d;background:#182d43;padding:10px;border-radius:7px}.card b{display:block;color:#72d7f0}.bar{height:7px;background:#385b89;margin-top:8px;width:70%}canvas{position:absolute;inset:0;pointer-events:none}#marker{width:32px;height:32px;z-index:100}
</style></head><body><div id="panel"><h1>OSF UI renderer benchmark</h1><p>Local deterministic workload · no network or game simulation</p><div class="grid"></div></div><canvas id="scene"></canvas><canvas id="marker" width="32" height="32"></canvas><script>
(() => {
  const api=window.osfui, panel=document.querySelector('#panel'), grid=document.querySelector('.grid');
  for(let i=0;i<160;i++){const c=document.createElement('div');c.className='card';c.innerHTML='<b>Setting '+i+'</b>Local menu row<div class="bar"></div>';grid.append(c);}
  const cards=[...document.querySelectorAll('.card')], canvas=document.querySelector('#scene'), ctx=canvas.getContext('2d');
  const markerCanvas=document.querySelector('#marker'), marker=markerCanvas.getContext('2d');
  const view=location.pathname.split('/')[2], layer=['main','second','third'].indexOf(view);
  let mode='idle',serial=0x110000,frames=0,next=0,angle=0;
  function mark(){
    serial=(serial+1)&0xffffff;
    // Eight RGB blocks carry three bits each. Wide binary channel ranges also
    // survive cross-channel color management of saturated WGC capture colors.
    for(let block=0;block<8;block++){
      const value=serial>>((7-block)*3);
      marker.fillStyle='rgb('+[(value&4)?255:0,(value&2)?255:0,(value&1)?255:0].join(',')+')';
      marker.fillRect((block%4)*8,Math.floor(block/4)*16,8,16);
    }
  }
  function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  resize();addEventListener('resize',resize);
  function send(name,payload){api.postMessage(JSON.stringify({kind:'send',name,payload}));}
  function layers(){
    const view=location.pathname.split('/')[2];
    ctx.clearRect(0,0,innerWidth,innerHeight);
    // Neutral grays keep exact alpha-composition checks independent of display gamut conversion.
    ctx.fillStyle=view==='main'?'#000000':view==='second'?'rgba(255,255,255,.5)':'rgba(64,64,64,.5)';
    ctx.fillRect(view==='third'?innerWidth/3:0,0,view==='main'?innerWidth:innerWidth*2/3,innerHeight);
  }
  api.onMessage=text=>{const m=JSON.parse(text);if(m.name==='bench.ping')send('bench.pong',m.payload);
    if(m.name==='bench.marker'){serial=m.payload.serial-1;mark();}
    if(m.name==='bench.mode'){
      mode=m.payload.mode;frames=0;next=0;angle=0;
      const mixed=mode.startsWith('mixed');
      markerCanvas.style.left=mixed?(layer*100/3)+'%':'0';
      if(mixed)serial=0x110000+layer*0x10000;
      panel.style.display=(mixed?layer!==0:['canvas','layers','pulse'].includes(mode))?'none':'block';
      ctx.clearRect(0,0,innerWidth,innerHeight);cards.forEach(c=>c.style.transform='');
      if(mode==='layers')layers();
      if(mixed&&layer===2){ctx.fillStyle='rgba(40,120,220,.5)';ctx.fillRect(innerWidth-280,80,240,120);}
      mark();send('bench.modeReady',{mode});}}
  function tick(now){requestAnimationFrame(tick);const mixed=mode.startsWith('mixed');
    if(mode==='idle'||mode==='layers'||(mixed&&layer===2))return;
    const rate=mixed&&layer===1?(mode==='mixed10'?10:30):60;
    if(now+0.5<next)return;next=Math.max(next+1000/rate,now-1000/rate);angle+=1/rate;
    if(mode==='canvas'){ctx.fillStyle='#101b29';ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<700;i++){const x=(i*97+angle*(30+i%80))%innerWidth,y=(i*53+Math.sin(angle+i)*60+innerHeight)%innerHeight;ctx.fillStyle='hsl('+(i*17%360)+' 65% 55% / .7)';ctx.beginPath();ctx.arc(x,y,8+i%22,0,Math.PI*2);ctx.fill();}}
    else if(mode==='pulse'){ctx.fillStyle=angle%2<1?'#000000':'#ffffff';ctx.fillRect(0,0,innerWidth,innerHeight);}
    else if(mixed&&layer===1){
      // A small transparent HUD damages only its previous/current bar and marker.
      ctx.clearRect(innerWidth/3,40,260,64);ctx.fillStyle='rgba(20,210,100,.75)';
      // Alternate widths so output pixels can prove that shrinking clears old paint.
      ctx.fillRect(innerWidth/3+8,48,(serial+1)&1?80:240,40);
    }
    else if(mode==='dom'||mixed){for(let i=0;i<cards.length;i++){cards[i].style.transform='translateX('+Math.sin(angle*3+i)*12+'px)';cards[i].querySelector('.bar').style.width=(50+40*Math.sin(angle+i))+'%';}}
    frames++;mark();}
  requestAnimationFrame(tick);mark();
  setInterval(()=>{send('bench.stats',{mode,frames,serial,dpr:devicePixelRatio,width:innerWidth,height:innerHeight});frames=0;},1000);
  send('bench.ready',{});
})();
</script></body></html>
