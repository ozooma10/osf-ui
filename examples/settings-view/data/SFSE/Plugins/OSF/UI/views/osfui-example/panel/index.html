<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings integration example</title>
  <link rel="stylesheet" href="style.css">
  <script src="/shared/osfui.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <h1>Settings integration example</h1>
    <p>Change “Show details” in OSF Settings, then open this panel with F6.</p>
    <p id="status">Waiting for the owning mod’s settings…</p>
    <p id="details" hidden>This section is controlled by the setting your mod forwarded.</p>
    <button id="close" autofocus>Close</button>
  </main>
</body>
</html>
