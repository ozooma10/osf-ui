<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__OSFUI_VIEW_TITLE__</title>
  <link rel="stylesheet" href="../../shared/osfui.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card osf-card">
    <p class="osf-eyebrow">MENU · NATIVE BRIDGE</p>
    <h1>OSF UI starter</h1>
    <p>Retained state, events, sends, and requests with plain HTML and JavaScript.</p>

    <section class="state">
      <span class="osf-eyebrow">Native count</span>
      <strong id="count">—</strong>
      <small id="last-action">Waiting for C++ state…</small>
    </section>

    <div class="actions">
      <button class="osf-btn osf-btn--osf-accent" id="increment" type="button">Increment</button>
      <button class="osf-btn" id="close" type="button">Close view</button>
    </div>

    <form id="greeting">
      <input class="osf-input" id="name" value="Explorer" aria-label="Name">
      <button class="osf-btn" type="submit">Request greeting</button>
    </form>

    <output id="status">Waiting for OSF UI…</output>
  </main>

  <script src="../../shared/osfui.js"></script>
  <script src="./main.js"></script>
</body>
</html>
