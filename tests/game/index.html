<!doctype html>
<html><head><meta charset="utf-8"><title>OSF UI backend acceptance</title>
<script src="/shared/osfui.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:22px Arial;color:white;background:transparent}
main{position:absolute;left:12%;top:12%;width:76%;height:76%;padding:36px;background:#12243bee;border:4px solid #67dafa}
h1{font-size:30px}input,button,select{font:22px Arial;padding:12px;margin:8px}input{width:260px}#marker{position:absolute;left:24px;top:24px;width:48px;height:48px;background:#ff00ff}#green{position:absolute;right:24px;bottom:24px;width:48px;height:48px;background:#00ff00}
#motion{height:15px;width:80px;background:#ffc64a;animation:slide 1s alternate infinite linear}@keyframes slide{to{transform:translateX(200px)}}
#drag{margin:12px;padding:20px;background:#345;height:75px}#scroll{height:80px;overflow:auto;background:#234}#scroll div{height:500px}
.hud main{left:70%;top:3%;width:28%;height:20%;padding:14px;font-size:14px}.hud h1{font-size:18px}.hud #controls{display:none}.hud #marker,.hud #green{width:24px;height:24px}
</style></head><body><main><h1>OSF UI backend acceptance</h1><p id="status">Checking the public bridge...</p><div id="motion"></div><section id="controls"><input id="text" aria-label="Test text"><button id="button">Count click</button><select id="select" aria-label="Native select"><option value="one">First option</option><option value="two">Second option</option><option value="three">Third option</option></select><div id="drag" data-osfui-relative-pointer>Relative pointer drag</div><div id="scroll"><div>Mouse wheel area</div></div><button id="close">Close view</button></section></main><div id="marker"></div><div id="green"></div>
<script src="test.js"></script></body></html>
